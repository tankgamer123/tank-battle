<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const WW = 1600, WH = 1000;
let VW = 0, VH = 0;
const joy = { id: null, bx: 0, by: 0, x: 0, y: 0, mag: 0, ang: 0 };
const fb = { id: null, down: false, x: 0, y: 0, r: 46 };

function resize() {
  const d = window.devicePixelRatio || 1;
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = VW * d; canvas.height = VH * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  fb.x = VW - 95; fb.y = VH - 95;
}
resize();
addEventListener('resize', resize);

// ===== random (hamesha ek jaisa map) =====
let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// ===== rukawat (deewar, crate, paani) =====
const solids = [
  { x: 780, y: 250, w: 40, h: 230, t: 'wall' },
  { x: 300, y: 520, w: 220, h: 36, t: 'wall' },
  { x: 1100, y: 620, w: 280, h: 36, t: 'wall' },
  { x: 1250, y: 160, w: 36, h: 220, t: 'wall' },
  { x: 600, y: 780, w: 260, h: 36, t: 'wall' },
  { x: 950, y: 120, w: 200, h: 36, t: 'wall' },
  { x: 0, y: 720, w: 330, h: 280, t: 'water' }
];
[[480, 260], [516, 260], [498, 296], [1000, 420], [1036, 420], [700, 560],
 [1180, 820], [1220, 820], [400, 150], [1450, 500]].forEach(([x, y]) => solids.push({ x, y, w: 36, h: 36, t: 'crate' }));

// ===== map (ek baar banta hai) =====
const mapCv = document.createElement('canvas');
mapCv.width = WW; mapCv.height = WH;
(function () {
  const m = mapCv.getContext('2d');
  for (let ty = 0; ty < WH; ty += 40) {
    for (let tx = 0; tx < WW; tx += 40) {
      const v = rnd();
      m.fillStyle = v < 0.33 ? '#4f8a3a' : v < 0.66 ? '#548f3e' : '#4a8436';
      m.fillRect(tx, ty, 40, 40);
    }
  }
  for (let i = 0; i < 500; i++) {
    m.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.07)';
    m.fillRect(rnd() * WW, rnd() * WH, 3, 3);
  }
  // mitti ka raasta
  const path = [[0, 420], [300, 380], [600, 450], [900, 380], [1200, 470], [1600, 420]];
  m.lineJoin = 'round'; m.lineCap = 'round';
  [['#a07a3e', 84], ['#b58f4f', 66]].forEach(([c, w]) => {
    m.strokeStyle = c; m.lineWidth = w;
    m.beginPath();
    path.forEach(([x, y], i) => i ? m.lineTo(x, y) : m.moveTo(x, y));
    m.stroke();
  });
  for (let i = 0; i < 160; i++) {
    const x = rnd() * WW, y = 340 + rnd() * 160;
    m.fillStyle = 'rgba(80,55,20,0.35)';
    m.fillRect(x, y, 3, 3);
  }
  // ped
  for (let i = 0; i < 80; i++) {
    const x = 30 + rnd() * (WW - 60), y = 30 + rnd() * (WH - 60), r = 20 + rnd() * 12;
    if (y > 320 && y < 540) continue;
    if (Math.hypot(x - 200, y - 300) < 120 || Math.hypot(x - 1300, y - 520) < 120) continue;
    if (solids.some(s => x > s.x - r && x < s.x + s.w + r && y > s.y - r && y < s.y + s.h + r)) continue;
    m.fillStyle = 'rgba(0,0,0,0.25)';
    m.beginPath(); m.ellipse(x + 5, y + 8, r, r * 0.7, 0, 0, Math.PI * 2); m.fill();
    m.fillStyle = '#2d6a28';
    m.beginPath(); m.arc(x, y, r, 0, Math.PI * 2); m.fill();
    m.fillStyle = '#3f8a38';
    m.beginPath(); m.arc(x - r * 0.25, y - r * 0.25, r * 0.65, 0, Math.PI * 2); m.fill();
  }
  // rukawat
  solids.forEach(s => {
    if (s.t === 'water') {
      m.fillStyle = '#d9c58a'; m.fillRect(s.x, s.y - 12, s.w + 12, s.h + 12);
      m.fillStyle = '#2f7fd0'; m.fillRect(s.x, s.y, s.w, s.h);
      m.strokeStyle = 'rgba(255,255,255,0.35)'; m.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        const x = s.x + rnd() * s.w, y = s.y + rnd() * s.h;
        m.beginPath(); m.moveTo(x, y); m.quadraticCurveTo(x + 10, y - 6, x + 20, y); m.stroke();
      }
    } else if (s.t === 'wall') {
      m.fillStyle = 'rgba(0,0,0,0.25)'; m.fillRect(s.x + 5, s.y + 6, s.w, s.h);
      m.fillStyle = '#8e9094'; m.fillRect(s.x, s.y, s.w, s.h);
      m.strokeStyle = '#4e5054'; m.lineWidth = 2; m.strokeRect(s.x, s.y, s.w, s.h);
      m.lineWidth = 1.5;
      if (s.w > s.h) {
        for (let x = s.x + 22; x < s.x + s.w; x += 22) { m.beginPath(); m.moveTo(x, s.y); m.lineTo(x, s.y + s.h); m.stroke(); }
      } else {
        for (let y = s.y + 22; y < s.y + s.h; y += 22) { m.beginPath(); m.moveTo(s.x, y); m.lineTo(s.x + s.w, y); m.stroke(); }
      }
    } else {
      m.fillStyle = 'rgba(0,0,0,0.25)'; m.fillRect(s.x + 4, s.y + 5, s.w, s.h);
      m.fillStyle = '#b47a3a'; m.fillRect(s.x, s.y, s.w, s.h);
      m.strokeStyle = '#6b4220'; m.lineWidth = 3; m.strokeRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
      m.beginPath(); m.moveTo(s.x, s.y); m.lineTo(s.x + s.w, s.y + s.h);
      m.moveTo(s.x + s.w, s.y); m.lineTo(s.x, s.y + s.h); m.stroke();
    }
  });
})();

// ===== tank =====
const COLORS = {
  green: { hull: '#4aa23a', dark: '#2a6620', turret: '#3a8a2c' },
  red:   { hull: '#d94a4a', dark: '#8a2222', turret: '#b83838' }
};
function mkTank(x, y, col, a) {
  return { x, y, a, hp: 100, max: 100, r: 18, cd: 0, col, dead: 0 };
}
const player = mkTank(200, 300, 'green', 0);
const enemy = mkTank(1300, 520, 'red', Math.PI);
const tanks = [player, enemy];
const ENEMY_SPAWNS = [[1300, 520], [1400, 200], [900, 850], [1450, 850], [650, 150], [1000, 300]];

let bullets = [], parts = [];
let scoreP = 0, scoreE = 0, timeLeft = 180, state = 'play', paused = false, shake = 0;
const cam = { x: 0, y: 0 };

function drawTank(t) {
  if (t.dead > 0) return;
  const c = COLORS[t.col];
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.a);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.roundRect(-18, -14, 40, 32, 6); ctx.fill();
  // track
  ctx.fillStyle = '#2b2f33';
  ctx.beginPath(); ctx.roundRect(-21, -19, 42, 9, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-21, 10, 42, 9, 3); ctx.fill();
  ctx.strokeStyle = '#555a60'; ctx.lineWidth = 1.5;
  for (let x = -17; x <= 17; x += 6) {
    ctx.beginPath(); ctx.moveTo(x, -19); ctx.lineTo(x, -10); ctx.moveTo(x, 10); ctx.lineTo(x, 19); ctx.stroke();
  }
  // body
  ctx.fillStyle = c.hull; ctx.strokeStyle = '#1b1f22'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-18, -12, 36, 24, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = c.dark;
  ctx.fillRect(-14, -8, 6, 16);
  // barrel
  ctx.fillStyle = c.dark;
  ctx.beginPath(); ctx.roundRect(2, -4, 28, 8, 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2b2f33';
  ctx.fillRect(26, -5, 6, 10);
  // turret
  ctx.fillStyle = c.turret;
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(-3, -3, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // health bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(t.x - 23, t.y - 34, 46, 7);
  ctx.fillStyle = t === player ? '#4cd137' : '#e8332f';
  ctx.fillRect(t.x - 22, t.y - 33, 44 * Math.max(0, t.hp) / t.max, 5);
}

// ===== particles =====
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + Math.random() * 15, max: 35, c: color, s: 2 + Math.random() * 2.5 });
  }
}
function boom(x, y) {
  burst(x, y, 20, '#ff9d00'); burst(x, y, 14, '#ffe066'); burst(x, y, 10, '#555');
  shake = 12;
}

// ===== rukawat se takrana =====
function collide(t) {
  t.x = Math.max(t.r, Math.min(WW - t.r, t.x));
  t.y = Math.max(t.r, Math.min(WH - t.r, t.y));
  for (const s of solids) {
    const cx = Math.max(s.x, Math.min(t.x, s.x + s.w));
    const cy = Math.max(s.y, Math.min(t.y, s.y + s.h));
    const dx = t.x - cx, dy = t.y - cy, d = Math.hypot(dx, dy);
    if (d < t.r) {
      if (d > 0.001) { t.x += dx / d * (t.r - d); t.y += dy / d * (t.r - d); }
      else t.x += t.r;
    }
  }
  for (const o of tanks) {
    if (o === t || o.dead > 0) continue;
    const dx = t.x - o.x, dy = t.y - o.y, d = Math.hypot(dx, dy), min = t.r + o.r;
    if (d < min && d > 0.001) { t.x += dx / d * (min - d) / 2; t.y += dy / d * (min - d) / 2; }
  }
}

function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function shoot(t) {
  const c = Math.cos(t.a), s = Math.sin(t.a);
  bullets.push({ x: t.x + c * 32, y: t.y + s * 32, vx: c * 9, vy: s * 9, o: t, life: 80 });
  t.cd = 16;
  burst(t.x + c * 34, t.y + s * 34, 4, '#ffe066');
}

function hit(t, b) {
  t.hp -= 12;
  burst(b.x, b.y, 6, '#ffb300');
  if (t.hp <= 0) {
    t.dead = 150;
    boom(t.x, t.y);
    if (b.o === player) scoreP++; else scoreE++;
  }
}

function respawn(t) {
  t.hp = t.max; t.cd = 30;
  if (t === player) { t.x = 200; t.y = 300; t.a = 0; }
  else {
    const list = ENEMY_SPAWNS.filter(p => Math.hypot(p[0] - player.x, p[1] - player.y) > 400);
    const p = list[Math.floor(Math.random() * list.length)] || ENEMY_SPAWNS[0];
    t.x = p[0]; t.y = p[1]; t.a = Math.PI;
  }
}

function restart() {
  scoreP = 0; scoreE = 0; timeLeft = 180; state = 'play'; paused = false;
  bullets = []; parts = [];
  player.dead = 0; enemy.dead = 0;
  respawn(player); respawn(enemy);
}

// ===== har frame ka kaam =====
function update(dt) {
  if (paused || state !== 'play') return;
  const f = dt * 60;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; state = 'over'; return; }

  const p = player;
  if (p.dead > 0) { p.dead -= f; if (p.dead <= 0) respawn(p); }
  else {
    if (joy.id !== null && joy.mag > 0.15) {
      const diff = angDiff(joy.ang, p.a);
      p.a += Math.max(-0.12 * f, Math.min(0.12 * f, diff));
      const sp = 2.6 * joy.mag * Math.max(0.2, Math.cos(diff)) * f;
      p.x += Math.cos(p.a) * sp;
      p.y += Math.sin(p.a) * sp;
      collide(p);
    }
    p.cd -= f;
    if (fb.down && p.cd <= 0) shoot(p);
  }

  if (enemy.dead > 0) { enemy.dead -= f; if (enemy.dead <= 0) respawn(enemy); }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let dead = false;
    const n = Math.ceil(f * 2);
    for (let s = 0; s < n && !dead; s++) {
      b.x += b.vx * f / n; b.y += b.vy * f / n;
      if (b.x < 0 || b.x > WW || b.y < 0 || b.y > WH) { dead = true; break; }
      for (const w of solids) {
        if (w.t === 'water') continue;
        if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
          dead = true; burst(b.x, b.y, 5, '#ddd'); break;
        }
      }
      if (dead) break;
      for (const t of tanks) {
        if (t === b.o || t.dead > 0) continue;
        if (Math.hypot(b.x - t.x, b.y - t.y) < t.r + 2) { hit(t, b); dead = true; break; }
      }
    }
    b.life -= f;
    if (b.life <= 0) dead = true;
    if (dead) bullets.splice(i, 1);
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.x += q.vx * f; q.y += q.vy * f; q.life -= f;
    if (q.life <= 0) parts.splice(i, 1);
  }
  shake *= 0.9;

  cam.x = WW <= VW ? (WW - VW) / 2 : Math.max(0, Math.min(WW - VW, p.x - VW / 2));
  cam.y = WH <= VH ? (WH - VH) / 2 : Math.max(0, Math.min(WH - VH, p.y - VH / 2));
}

// ===== screen banana =====
function fmt(s) {
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function drawHUD() {
  // pause button
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(10, 10, 40, 40, 8); ctx.fill();
  ctx.fillStyle = '#fff';
  if (paused) { ctx.beginPath(); ctx.moveTo(24, 20); ctx.lineTo(38, 30); ctx.lineTo(24, 40); ctx.fill(); }
  else { ctx.fillRect(21, 20, 5, 20); ctx.fillRect(33, 20, 5, 20); }
  // health bar
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(58, 18, 172, 24, 8); ctx.fill();
  const w = 164 * Math.max(0, player.hp) / player.max;
  if (w > 2) { ctx.fillStyle = '#4cd137'; ctx.beginPath(); ctx.roundRect(62, 22, w, 16, 6); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.fillText(Math.max(0, Math.round(player.hp)), 144, 36);
  // score + timer
  const cx = VW / 2;
  ctx.fillStyle = '#1f5fd0'; ctx.beginPath(); ctx.roundRect(cx - 84, 10, 40, 30, 6); ctx.fill();
  ctx.fillStyle = '#d02a2a'; ctx.beginPath(); ctx.roundRect(cx + 44, 10, 40, 30, 6); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(cx - 40, 10, 80, 30, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial';
  ctx.fillText(scoreP, cx - 64, 33);
  ctx.fillText(scoreE, cx + 64, 33);
  ctx.font = 'bold 18px Arial';
  ctx.fillText(fmt(timeLeft), cx, 32);

  // joystick
  const jx = joy.id !== null ? joy.bx : 110, jy = joy.id !== null ? joy.by : VH - 110;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(jx, jy, 60, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(joy.id !== null ? joy.x : jx, joy.id !== null ? joy.y : jy, 28, 0, Math.PI * 2); ctx.fill();

  // FIRE button
  ctx.fillStyle = fb.down ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.22)';
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.translate(fb.x, fb.y); ctx.rotate(-0.8);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(-6, -6, 12, 24, 4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(0, -20); ctx.lineTo(6, -6); ctx.fill();
  ctx.restore();

  if (paused || state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#ffd800'; ctx.font = 'bold 44px Arial';
    if (state === 'over') {
      const msg = scoreP > scoreE ? 'TUM JEET GAYE!' : scoreP < scoreE ? 'TUM HAAR GAYE' : 'BARABAR!';
      ctx.fillText(msg, cx, VH / 2 - 6);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial';
      ctx.fillText('Dobara khelne ke liye screen dabao', cx, VH / 2 + 32);
    } else {
      ctx.fillText('PAUSED', cx, VH / 2);
    }
  }
  ctx.textAlign = 'left';
}

function draw() {
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  const sx = shake > 0.5 ? (Math.random() - 0.5) * shake : 0;
  const sy = shake > 0.5 ? (Math.random() - 0.5) * shake : 0;
  ctx.translate(-cam.x + sx, -cam.y + sy);
  ctx.drawImage(mapCv, 0, 0);
  tanks.forEach(drawTank);
  bullets.forEach(b => {
    ctx.strokeStyle = 'rgba(255,150,0,0.6)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 1.2, b.y - b.vy * 1.2); ctx.stroke();
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
  });
  parts.forEach(q => {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
}

// ===== touch controls =====
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const x = e.clientX, y = e.clientY;
  if (state === 'over') { restart(); return; }
  if (x < 60 && y < 60) { paused = !paused; return; }
  if (paused) return;
  if (Math.hypot(x - fb.x, y - fb.y) < fb.r + 20) { fb.id = e.pointerId; fb.down = true; return; }
  if (x < VW * 0.55 && joy.id === null) {
    joy.id = e.pointerId; joy.bx = joy.x = x; joy.by = joy.y = y; joy.mag = 0;
  }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === joy.id) {
    const dx = e.clientX - joy.bx, dy = e.clientY - joy.by, d = Math.hypot(dx, dy), R = 60;
    const k = d > R ? R / d : 1;
    joy.x = joy.bx + dx * k; joy.y = joy.by + dy * k;
    joy.mag = Math.min(1, d / R); joy.ang = Math.atan2(dy, dx);
  }
});
function release(e) {
  if (e.pointerId === joy.id) { joy.id = null; joy.mag = 0; }
  if (e.pointerId === fb.id) { fb.id = null; fb.down = false; }
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

// ===== game loop =====
let last = 0;
function loop(ts) {
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>

// ===== STEP 2: ENEMY BOTS (AI) =====
COLORS.orange = { hull: '#f0a030', dark: '#9a5a10', turret: '#d08820' };
COLORS.purple = { hull: '#9a5ad9', dark: '#5a2a8a', turret: '#7c44b8' };

const bots = [enemy];
const bot2 = mkTank(1400, 200, 'orange', Math.PI);
const bot3 = mkTank(900, 850, 'purple', Math.PI);
tanks.push(bot2, bot3);
bots.push(bot2, bot3);
bots.forEach(t => { t.stuck = 0; t.avoid = 0; t.avoidDir = 0; });

// kya beech mein deewar ya crate hai?
function los(a, b) {
  const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.ceil(d / 16);
  for (let i = 1; i < n; i++) {

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();

  sfxG = AC.createGain(); sfxG.gain.value = 0.6; sfxG.connect(master);

  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);

function tone(freq, dur, type, vol, slide, delay, dest) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxG);
  o.start(t); o.stop(t + dur + 0.05);
}

  if (!AC) return;

  const fl = AC.createBiquadFilter(); fl.type = 'lowpass';
  fl.frequency.setValueAtTime(f0, t);
  fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(Math.max(0.0002, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(dest || sfxG);
  s.start(t); s.stop(t + Math.min(dur, 0.9) + 0.05);
}

const CHORDS = [
  [110, [440, 523, 659]], [87.3, [349, 440, 523]],
  [130.8, [392, 523, 659]], [98, [392, 494, 587]]
];
let nextT = 0, mStep = 0;
function playStep(step, delay) {
  const ch = CHORDS[Math.floor(step / 8) % 4], s = step % 8;
  if (s % 2 === 0) tone(ch[0], 0.22, 'triangle', 0.3, null, delay, musG);
  const arp = [0, 1, 2, 1, 0, 1, 2, 1][s];

  if (s === 0 || s === 4) tone(130, 0.25, 'sine', 0.5, 40, delay, musG);
  if (s % 2 === 1) noise(0.04, 0.12, 9000, 6000, delay, musG);

  if (!AC) return;
  if (nextT < AC.currentTime) nextT = AC.currentTime + 0.05;
  while (nextT < AC.currentTime + 0.2) {
    playStep(mStep, nextT - AC.currentTime);
    nextT += 0.25;
    mStep = (mStep + 1) % 32;

  if (!AC) return;

}

// sabse paas ka dushman
function nearestFoe() {
  let best = null, bd = 700;
  tanks.forEach(t => {
    if (t === player || t.dead > 0) return;
    const d = Math.hypot(t.x - player.x, t.y - player.y);
    if (d < bd) { bd = d; best = t; }
  });
  return best;
}

    let tgt = player.a;
    if (fb.down) {
      if (fb.aimed) tgt = fb.ang;
      else {
        const foe = nearestFoe();
        if (foe) tgt = Math.atan2(foe.y - player.y, foe.x - player.x);
      }

    const diff = angDiff(tgt, player.ta);

function ntSend(m) { try { if (conn && conn.open) conn.send(m); } catch (e) {} }

// ===== PeerJS library =====
function loadPeer(cb) {
  if (window.Peer) return cb();
  const urls = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
                'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
  let i = 0;
  (function tryNext() {
    if (i >= urls.length) { ntStatus('Library load nahi hui. Internet check karo.'); return; }
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = cb;
    s.onerror = tryNext;
    document.head.appendChild(s);
  })();
}

// ===== LOBBY SCREEN =====
const lobby = document.createElement('div');
lobby.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,26,0.96);color:#fff;font-family:Arial,sans-serif;text-align:center;padding:12px;overflow-y:auto;';
lobby.innerHTML =
  '<div style="font-size:26px;font-weight:900;">🌐 ONLINE BATTLE</div>' +
  '<div style="font-size:14px;opacity:.8;">Dost ke saath aamne-saamne</div>' +
  '<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;">' +
    '<div style="background:rgba(255,255,255,0.08);border-radius:14px;padding:12px;min-width:220px;">' +
      '<div style="font-weight:900;margin-bottom:8px;">🏠 ROOM BANAO</div>' +

    '</div>' +
    '<div style="background:rgba(255,255,255,0.08);border-radius:14px;padding:12px;min-width:220px;">' +
      '<div style="font-weight:900;margin-bottom:8px;">🔗 ROOM MEIN JUDO</div>' +
      '<input id="n-code" type="tel" maxlength="4" placeholder="4 number code" style="font-size:22px;width:150px;text-align:center;border-radius:10px;border:none;padding:8px;margin-bottom:10px;">' +
      '<br><button id="n-join" style="' + NB + '">JOIN</button>' +

document.body.appendChild(lobby);

[['forest', '🌲'], ['desert', '🏜️'], ['snow', '❄️'], ['night', '🌙']].forEach(([k, ic]) => {
  const b = document.createElement('button');
  b.textContent = ic; b.dataset.k = k;
  b.style.cssText = 'font-size:24px;border:3px solid ' + (k === net.theme ? '#ffd800' : 'transparent') + ';border-radius:10px;background:#3a4a6a;padding:6px 10px;';
  b.onclick = () => {

onBtn.onclick = () => { ntStatus(''); lobby.style.display = 'flex'; };
mapUI.appendChild(onBtn);

lobby.querySelector('#n-back').onclick = () => {
  const p = peer; conn = null; peer = null; net.role = '';
  try { if (p) p.destroy(); } catch (e) {}
  lobby.querySelector('#n-make').disabled = false;
  lobby.style.display = 'none';
};

// ===== ROOM BANANA (host) =====
lobby.querySelector('#n-make').onclick = function () {
  this.disabled = true;
  ntStatus('Ruko...');
  makeRoom();
};
function makeRoom() {
  loadPeer(() => {
    const code = String(1000 + Math.floor(Math.random() * 9000));
    net.role = 'host';
    peer = new Peer('tbtl' + code);
    peer.on('open', () => {
      ntStatus('Room code: <span style="font-size:42px;color:#ffd800;letter-spacing:6px;">' + code +
        '</span><br><span style="font-size:14px;font-weight:normal;">Ye code dost ko bhejo. Wo JOIN dabayega to game shuru ho jayega.</span>');
    });
    peer.on('connection', c => {
      if (conn) { c.close(); return; }
      conn = c; wire(c);
    });
    peer.on('error', e => {
      if (e.type === 'unavailable-id') { try { peer.destroy(); } catch (x) {} makeRoom(); }
      else { ntStatus('Error: ' + e.type); lobby.querySelector('#n-make').disabled = false; }
    });
  });
}

// ===== ROOM MEIN JUDNA (guest) =====
lobby.querySelector('#n-join').onclick = () => {
  const code = lobby.querySelector('#n-code').value.trim();
  if (code.length !== 4) { ntStatus('4 number ka code daalo'); return; }
  ntStatus('Connect ho raha hai...');
  loadPeer(() => {
    net.role = 'guest';
    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect('tbtl' + code, { reliable: true, serialization: 'json' });
      wire(conn);
      net.jt = setTimeout(() => { if (!net.on) ntStatus('Connect nahi hua. Code check karo aur dobara try karo.'); }, 15000);
    });
    peer.on('error', e => {
      ntStatus(e.type === 'peer-unavailable' ? 'Room nahi mila. Code check karo.' : 'Error: ' + e.type);
    });
  });
};

function wire(c) {
  c.on('open', () => {
    if (net.role === 'guest') {
      const T = TK.find(t => t.id === tbSel) || TK[0], S = tkStats(T.id);
      ntSend({ t: 'hello', hp: S.hp, spd: S.speed, dmg: S.dmg, cd: S.cd, c: T.col });
    }
  });
  c.on('data', onData);
  c.on('close', () => {
    if (conn !== c) return;
    tbToast('Dost disconnect ho gaya');
    setTimeout(() => location.reload(), 1600);
  });
}

function onData(m) {
  if (!m || !m.t) return;
  if (net.role === 'host') {
    if (m.t === 'hello') startHost(m);
    else if (m.t === 'i') net.inp = m;
  } else {
    if (m.t === 'start') startGuest(m);
    else if (m.t === 's' && net.on) applySnap(m);
  }
}

function ntCommonStart() {
  [bot2, bot3].forEach(b => { const i = tanks.indexOf(b); if (i >= 0) tanks.splice(i, 1); });
  bots.length = 0;
  lobby.style.display = 'none';
  mapUI.style.display = 'none';
  mapBtn.style.display = 'none';
  gameGarage.style.display = 'none';
  exitBtn.style.display = 'block';
  paused = false;
}

// ===== HOST =====
function startHost(m) {
  if (net.on) return;
  net.on = true;
  COLORS.rem = m.c;
  enemy.col = 'rem'; enemy.max = m.hp; enemy.spd = m.spd; enemy.dmg = m.dmg; enemy.cdv = m.cd; enemy.ta = Math.PI;
  ntCommonStart();
  buildMap(net.theme);
  applyTank();
  restart();
  ntSend({ t: 'start', theme: net.theme, c: COLORS.mine });
  installHost();
}

function ctrlRemote(t, inp, f) {
  if (t.dead > 0) return;
  let sp = 0;
  if (inp.jm > 0.15) {
    const diff = angDiff(inp.ja, t.a);
    t.a += Math.max(-0.12 * f, Math.min(0.12 * f, diff));
    sp = (t.spd || 2.6) * inp.jm * Math.max(0.2, Math.cos(diff)) * f;
    if (t.fx.speed > 0) sp *= 1.7;
    t.x += Math.cos(t.a) * sp;
    t.y += Math.sin(t.a) * sp;
    collide(t);
  }
  let tgt = t.a;
  if (inp.fd) {
    if (inp.fa) tgt = inp.fg;
    else if (player.dead <= 0 && Math.hypot(player.x - t.x, player.y - t.y) < 700) tgt = Math.atan2(player.y - t.y, player.x - t.x);
  }
  const rate = (inp.fd ? 0.35 : 0.15) * f;
  t.ta += Math.max(-rate, Math.min(rate, angDiff(tgt, t.ta)));
  t.cd -= f;
  if (inp.fd && t.cd <= 0 && Math.abs(angDiff(tgt, t.ta)) <= 0.2) {
    const keep = t.a;
    t.a = t.ta;
    shoot(t);
    t.a = keep;
    t.cd = t.cdv || 16;
  }
}

function snap() {
  const T = [player, enemy].map(t => [Math.round(t.x * 10) / 10, Math.round(t.y * 10) / 10,
    +t.a.toFixed(3), +t.ta.toFixed(3), Math.round(t.hp), t.max, t.dead > 0 ? 1 : 0, (t.fx && t.fx.shield > 0) ? 1 : 0]);
  return {
    t: 's', T,
    B: bullets.map(b => [Math.round(b.x), Math.round(b.y), +b.vx.toFixed(2), +b.vy.toFixed(2), b.o === player ? 0 : 1]),
    U: powerups.map(p => [Math.round(p.x), Math.round(p.y), p.k, Math.round(p.life)]),
    S: [scoreP, scoreE], L: Math.round(timeLeft * 10) / 10, st: state,
    F: NT_FX.map(k => Math.round(Math.max(0, enemy.fx[k]))),
    E: net.ev.splice(0)
  };
}

function installHost() {
  const prev = update;
  update = function (dt) {
    paused = false;
    prev(dt);
    if (state === 'play') ctrlRemote(enemy, net.inp, dt * 60);
    net.acc += dt;
    if (net.acc >= 0.066) { net.acc = 0; ntSend(snap()); }
  };
}

// ===== GUEST =====
function startGuest(m) {
  if (net.on) return;
  clearTimeout(net.jt);
  net.on = true;
  COLORS.hostc = m.c;
  enemy.col = 'hostc'; enemy.ta = 0; player.ta = 0;
  ntCommonStart();
  buildMap(m.theme);
  applyTank();
  state = 'play'; scoreP = 0; scoreE = 0;
  bullets = []; parts = []; powerups.length = 0;
  update = guestUpdate;
}

function ntSet(t, a) {
  if (t.tx === undefined) { t.x = a[0]; t.y = a[1]; t.a = a[2]; t.ta = a[3]; }
  t.tx = a[0]; t.ty = a[1]; t.ra = a[2]; t.rta = a[3];
  t.hp = a[4]; t.max = a[5]; t.dead = a[6] ? 150 : 0; t.fx.shield = a[7] ? 100 : 0;
}

function applySnap(m) {
  ntSet(enemy, m.T[0]);
  ntSet(player, m.T[1]);
  NT_FX.forEach((k, i) => { player.fx[k] = m.F[i]; });
  bullets = m.B.map(b => ({ x: b[0], y: b[1], vx: b[2], vy: b[3], o: b[4] === 1 ? player : enemy }));
  powerups.length = 0;
  m.U.forEach(u => powerups.push({ x: u[0], y: u[1], k: u[2], life: u[3] }));
  scoreP = m.S[1]; scoreE = m.S[0];
  timeLeft = m.L; state = m.st;
  m.E.forEach(e => {
    if (e.k === 'b') boom(e.x, e.y);
    else if (e.k === 'h') { burst(e.x, e.y, 6, '#ffb300'); sfx.hit(); }
    else if (e.k === 's') { burst(e.x, e.y, 8, '#7ec8ff'); sfx.shield(); }
    else if (e.k === 'f') { burst(e.x, e.y, 4, '#ffe066'); sfx.fire(e.w === 1 ? 1 : 0.6); }
    else if (e.k === 'p') { burst(e.x, e.y, 14, '#ffd800'); if (e.w === 1) sfx.pickup(); }
    else if (e.k === 'r') { parts.length = 0; net.awarded = false; overPlayed = false; }
  });
}

function guestUpdate(dt) {
  const f = dt * 60;
  paused = false;
  [player, enemy].forEach(t => {
    if (t.tx === undefined) return;
    const k = Math.min(1, 0.4 * f);
    t.x += (t.tx - t.x) * k; t.y += (t.ty - t.y) * k;
    t.a += angDiff(t.ra, t.a) * k; t.ta += angDiff(t.rta, t.ta) * k;
  });
  bullets.forEach(b => { b.x += b.vx * f; b.y += b.vy * f; });
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.x += q.vx * f; q.y += q.vy * f; q.life -= f;
    if (q.life <= 0) parts.splice(i, 1);
  }
  pwT += f;
  shake *= 0.9;
  if (!fb.down) { fb.aimed = false; fb.kx = 0; fb.ky = 0; }
  cam.x = WW <= VW ? (WW - VW) / 2 : Math.max(0, Math.min(WW - VW, player.x - VW / 2));
  cam.y = WH <= VH ? (WH - VH) / 2 : Math.max(0, Math.min(WH - VH, player.y - VH / 2));

  net.acc2 += dt;
  if (net.acc2 >= 0.033) {
    net.acc2 = 0;
    ntSend({ t: 'i', jm: joy.id !== null ? +joy.mag.toFixed(2) : 0, ja: +joy.ang.toFixed(3),
      fd: fb.down ? 1 : 0, fa: fb.aimed ? 1 : 0, fg: +fb.ang.toFixed(3) });
  }

  const want = state === 'play';
  if (want !== lastWant) { lastWant = want; setMusic(want); }
  if (state === 'play') { net.awarded = false; overPlayed = false; }
  if (state === 'over') {
    if (!overPlayed) { overPlayed = true; if (scoreP >= scoreE) sfx.win(); else sfx.lose(); }
    if (!net.awarded) {
      net.awarded = true;
      lastReward = (scoreP > scoreE ? 50 : scoreP === scoreE ? 20 : 10) + 10 * scoreP;
      tbCoins += lastReward; saveG();
    }
  }
}

// ===== game ke events (host se guest ko) =====
const _b7 = boom;
boom = function (x, y) {
  _b7(x, y);
  if (net.role === 'host' && net.on) net.ev.push({ k: 'b', x: Math.round(x), y: Math.round(y) });
};

const _sh7 = shoot;
shoot = function (t) {
  const n = bullets.length;
  _sh7(t);
  if (net.role === 'host' && net.on && bullets.length > n)
    net.ev.push({ k: 'f', x: Math.round(t.x), y: Math.round(t.y), w: t === player ? 0 : 1 });
};

const _pu7 = takePU;
takePU = function (t, pu) {
  _pu7(t, pu);
  if (net.role === 'host' && net.on) net.ev.push({ k: 'p', x: Math.round(pu.x), y: Math.round(pu.y), w: t === player ? 0 : 1 });
};

// online mein damage
function netHit(t, b) {
  if (t.fx && t.fx.shield > 0) {
    burst(b.x, b.y, 8, '#7ec8ff'); sfx.shield();
    net.ev.push({ k: 's', x: Math.round(b.x), y: Math.round(b.y) });
    return;
  }
  let dmg = b.o.dmg || 12;
  if (b.o.fx && b.o.fx.power > 0) dmg *= 2;
  t.hp -= dmg;
  burst(b.x, b.y, 6, '#ffb300'); sfx.hit();
  net.ev.push({ k: 'h', x: Math.round(b.x), y: Math.round(b.y) });
  if (t.hp <= 0) {
    t.dead = 150;
    boom(t.x, t.y);
    if (b.o === player) { scoreP++; tbCoins += 10; saveG(); } else scoreE++;
  }
}
const _h7 = hit;
hit = function (t, b) {
  if (!net.on) return _h7(t, b);
  netHit(t, b);
};

const _rs7 = respawn;
respawn = function (t) {
  _rs7(t);
  if (t.ta !== undefined) t.ta = t.a;
};

const _r7 = restart;
restart = function () {
  if (net.on && net.role === 'guest') return;
  _r7();
  if (net.on) net.ev.push({ k: 'r' });
};

// dost ka tank bhi alag turret ke saath
const _dt7 = drawTank;
drawTank = function (t) {
  if (!net.on) return _dt7(t);
  if (t === player) { drawPickups(); drawPlayerTank(t); return; }
  if (t.dead > 0) return;
  const keep = fb.down;
  fb.down = false;
  drawPlayerTank(t);
  fb.down = keep;
  ctx.fillStyle = '#e8332f';
  ctx.fillRect(t.x - 22, t.y - 33, 44 * Math.max(0, t.hp) / t.max, 5);
  ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText('DOST', t.x, t.y - 38);
  ctx.textAlign = 'left';
};

// bahar nikalne ka button
const exitBtn = document.createElement('button');
exitBtn.textContent = '✖';
exitBtn.style.cssText = 'display:none;position:fixed;top:10px;right:10px;z-index:15;width:44px;height:44px;font-size:22px;border:none;border-radius:10px;background:rgba(200,40,40,0.8);color:#fff;';
exitBtn.onclick = () => { location.reload(); };
document.body.appendChild(exitBtn);

// ===== TUTORIAL =====
const TUT = [
  ['🎮', 'TANK CHALANA', 'Left side par ungli rakho aur ghumao.<br>Tank usi taraf chalega.<br>Deewar, crate aur paani se takrayega.'],

  ['🏆', 'JEETNA', '3 minute mein jo zyada tank udaye wo jeetega.<br>Kill par 🪙10, jeet par 🪙50.<br>Coins se Garage mein naya tank aur upgrade lo.']

const tutUI = mkOv(40, 'rgba(8,12,22,0.97)');
let tutI = 0, tutDone = null;
function showTut(done) { tutI = 0; tutDone = done; renderTut(); tutUI.style.display = 'flex'; }
function endTut() { tutUI.style.display = 'none'; const d = tutDone; tutDone = null; if (d) d(); }
function renderTut() {
  const T = TUT[tutI], last = tutI === TUT.length - 1;
  tutUI.innerHTML = '<div style="' + WRAP + '">' +
    '<div style="font-size:54px;">' + T[0] + '</div>' +

// ===== STEP 9: DAILY GIFT + MISSIONS + STATS =====
function fmtD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayStr = () => fmtD(new Date());
const yesterdayStr = () => fmtD(new Date(Date.now() - 864e5));

let ms = { day: '', list: [], gift: { last: '', streak: 0 }, st: { kills: 0, wins: 0, matches: 0, picks: 0 } };
try {
  const s = JSON.parse(localStorage.getItem('tb_ms') || 'null');
  if (s) ms = Object.assign(ms, s);
} catch (e) {}
function saveMs() { try { localStorage.setItem('tb_ms', JSON.stringify(ms)); } catch (e) {} }

const MPOOL = {
  kills: { t: '💥 Dushman udao', n: [4, 5, 6], r: 20 },
  wins:  { t: '🏆 Match jeeto', n: [1, 2], r: 80 },
  picks: { t: '⭐ Power-up uthao', n: [2, 3, 4], r: 25 }
};
const GIFT = [100, 150, 200, 250, 300, 400, 600];

function newDay() {
  const t = todayStr();
  if (ms.day === t && ms.list.length) return;
  ms.day = t;
  ms.list = Object.keys(MPOOL).map(k => {
    const P = MPOOL[k], n = P.n[Math.floor(Math.random() * P.n.length)];
    return { k, n, p: 0, r: n * P.r, done: 0 };
  });
  saveMs();
}

function track(k, n) {
  newDay();
  if (ms.st[k] !== undefined) ms.st[k] += n;
  ms.list.forEach(m => { if (m.k === k && !m.done) m.p = Math.min(m.n, m.p + n); });
  saveMs();
}

function giftState() {
  if (ms.gift.last === todayStr()) return { can: false, day: ms.gift.streak };
  const next = ms.gift.last === yesterdayStr() ? ms.gift.streak + 1 : 1;
  return { can: true, day: next };
}
function qReady() {
  newDay();
  return giftState().can || ms.list.some(m => !m.done && m.p >= m.n);
}

// ===== game se tracking =====
let pS = 0, pOver = false;
const pFx = { shield: 0, speed: 0, triple: 0, power: 0 };
setInterval(() => {
  if (scoreP > pS) track('kills', scoreP - pS);
  pS = scoreP;
  if (state === 'over' && !pOver) {
    pOver = true;
    ms.st.matches++;
    if (scoreP > scoreE) track('wins', 1);
    saveMs();
  }
  if (state === 'play') pOver = false;
  NT_FX.forEach(k => {
    const v = (player.fx && player.fx[k]) || 0;
    if (v > pFx[k] + 60) track('picks', 1);
    pFx[k] = v;
  });
}, 250);

const _pu9 = takePU;
takePU = function (t, pu) {
  _pu9(t, pu);
  if (t === player && pu.k === 'health') track('picks', 1);
};

// ===== MISSIONS SCREEN =====
const qUI = mkOv(27, 'linear-gradient(#1b2a4a,#0f1626)');
function renderQ() {
  newDay();
  const g = giftState(), reward = GIFT[(g.day - 1) % 7];
  const slot = g.can ? (g.day - 1) % 7 : ((ms.gift.streak - 1) % 7 + 7) % 7;
  const boxes = GIFT.map((c, i) => {
    const got = i < slot || (i === slot && !g.can), now = i === slot && g.can;
    return '<div style="flex:1;min-width:0;border-radius:8px;padding:5px 2px;font-size:11px;font-weight:bold;background:' +
      (got ? '#3b7a3b' : now ? '#e8a317' : 'rgba(255,255,255,0.1)') + ';border:2px solid ' + (now ? '#ffd800' : 'transparent') + ';">' +
      (got ? '✔' : 'D' + (i + 1)) + '<br>🪙' + c + '</div>';
  }).join('');

  const rows = ms.list.map((m, i) => {
    const P = MPOOL[m.k], ok = m.p >= m.n;
    const btn = m.done ? '<button disabled style="' + MB3 + 'font-size:13px;padding:9px 12px;">✔</button>'
      : ok ? '<button data-q="' + i + '" style="' + MB + 'font-size:14px;padding:9px 12px;">🪙 ' + m.r + '</button>'
      : '<div style="font-weight:bold;opacity:.8;min-width:64px;">🪙 ' + m.r + '</div>';
    return '<div style="background:rgba(255,255,255,0.08);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px;text-align:left;">' +
      '<div style="flex:1;"><div style="font-weight:bold;">' + P.t + ' <span style="opacity:.7;font-weight:normal;">(' + m.p + '/' + m.n + ')</span></div>' +
      '<div style="height:8px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;margin-top:6px;">' +
      '<div style="height:100%;width:' + Math.round(100 * m.p / m.n) + '%;background:#ffb300;"></div></div></div>' + btn + '</div>';
  }).join('');

  qUI.innerHTML = '<div style="' + WRAP + 'max-width:480px;">' +
    '<div style="font-size:24px;font-weight:900;">📋 MISSIONS</div>' +
    '<div style="width:100%;background:rgba(255,255,255,0.08);border-radius:14px;padding:10px;">' +
      '<div style="font-weight:900;margin-bottom:6px;">🎁 DAILY GIFT</div>' +
      '<div style="display:flex;gap:4px;margin-bottom:8px;">' + boxes + '</div>' +
      (g.can ? '<button id="q-gift" style="' + MB + '">🎁 LO +' + reward + ' 🪙</button>'
             : '<button disabled style="' + MB3 + '">✔ AAJ KA LE LIYA, KAL AANA</button>') +
    '</div>' +
    '<div style="width:100%;display:flex;flex-direction:column;gap:8px;">' +
      '<div style="font-weight:900;text-align:left;">AAJ KE MISSION</div>' + rows + '</div>' +
    '<div style="font-size:13px;opacity:.85;">💥 ' + ms.st.kills + ' kills &nbsp;·&nbsp; 🏆 ' + ms.st.wins +
      ' jeet &nbsp;·&nbsp; 🎮 ' + ms.st.matches + ' match</div>' +
    '<div style="font-weight:bold;">🪙 ' + tbCoins + '</div>' +
    '<button id="q-back" style="' + MB3 + '">◀ WAPAS</button></div>';

  const gb = qUI.querySelector('#q-gift');
  if (gb) gb.onclick = () => {
    const gs = giftState();
    if (!gs.can) return;
    ms.gift.last = todayStr(); ms.gift.streak = gs.day;
    tbCoins += GIFT[(gs.day - 1) % 7];
    saveG(); saveMs();
    if (AC) sfx.pickup();
    renderQ();
  };
  qUI.querySelectorAll('[data-q]').forEach(b => {
    b.onclick = () => {
      const m = ms.list[+b.dataset.q];
      if (!m || m.done || m.p < m.n) return;
      m.done = 1; tbCoins += m.r;
      saveG(); saveMs();
      if (AC) sfx.pickup();
      renderQ();
    };
  });
  qUI.querySelector('#q-back').onclick = () => { qUI.style.display = 'none'; renderMenu(); };
}

// ===== main menu mein MISSIONS button =====
const _rm9 = renderMenu;
renderMenu = function () {
  _rm9();
  const row = menuUI.querySelector('#m-full').parentNode;
  const b = document.createElement('button');
  b.style.cssText = MB2;
  b.innerHTML = '📋 MISSIONS' + (qReady() ? ' <span style="color:#ff4d4d;">●</span>' : '');
  b.onclick = () => { renderQ(); qUI.style.display = 'flex'; };
  row.insertBefore(b, row.firstChild);
};
renderMenu();
</script>
